<!DOCTYPE html>
<html>
<head>
    <title>Admin Login | LifeFlow</title>
    <style>
        body{
            background:#fff1f1;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .login-box{
            background:white;
            padding:30px;
            width:350px;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }
        h2{color:#d10000;text-align:center;}
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }
        button{
            width:100%;
            padding:10px;
            background:#d10000;
            color:white;
            border:none;
            cursor:pointer;
        }
        .error{color:red;text-align:center;}
    </style>
</head>
<body>

<div class="login-box">
    <h2>🛡 Admin Login</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'admin_login' %}">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Admin Username" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>
</form>

</div>

</body>
</html>
